<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Outreach Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0b0d12;
    --panel: #12151c;
    --panel2: #171b24;
    --card: #1b202b;
    --border: #262c39;
    --border-soft: #1e2330;
    --text: #eceef3;
    --text-dim: #8991a3;
    --text-faint: #5c6478;
    --brass: #c9a15a;
    --brass-dim: #3a3020;
    --brass-text: #e0bd7f;
    --blue: #6c93ff;
    --blue-dim: #1c2540;
    --green: #6bb894;
    --green-dim: #1a2b23;
    --red: #d8737a;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --font-display: "Fraunces", Georgia, serif;
    --font-sans: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: var(--font-sans);
    background: var(--ink);
    color: var(--text);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    display:grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 64px 1fr;
    height:100vh;
  }

  /* ---------- topbar ---------- */
  .topbar{
    grid-column: 1 / 3;
    background: var(--panel);
    border-bottom:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    padding: 0 24px;
    gap:18px;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    white-space:nowrap;
  }
  .logo .mark{
    width:26px;height:26px;
    border-radius:7px;
    background: linear-gradient(155deg, var(--brass), #8a6a2f);
    display:flex;align-items:center;justify-content:center;
    font-family: var(--font-display);
    font-weight:600;
    font-size:14px;
    color:#171106;
  }
  .logo .wordmark{
    font-family: var(--font-display);
    font-size:18px;
    font-weight:500;
    letter-spacing:0.2px;
  }
  .badge-sim{
    font-size:10.5px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color: var(--text-faint);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  .lang-toggle button{
    background: transparent;
    border:none;
    color: var(--text-dim);
    font-family: var(--font-sans);
    font-size:12px;
    font-weight:500;
    padding:7px 13px;
    cursor:pointer;
    transition: background 0.15s, color 0.15s;
  }
  .lang-toggle button + button{ border-left:1px solid var(--border); }
  .lang-toggle button.active{
    background: var(--brass-dim);
    color: var(--brass-text);
  }
  .stats{
    margin-left:auto;
    display:flex;
    gap:28px;
  }
  .stat-item{ text-align:right; }
  .stat-item .num{
    font-family: var(--font-display);
    font-size:17px;
    font-weight:500;
    color: var(--text);
    line-height:1.1;
  }
  .stat-item .lbl{
    font-size:10.5px;
    color: var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-top:1px;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    background: var(--panel);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-head{
    padding:16px 18px 12px;
    border-bottom:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .sidebar-head input[type=text]{
    width:100%;
    background: var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:var(--radius-sm);
    font-size:13px;
    font-family: var(--font-sans);
    outline:none;
    transition: border-color 0.15s;
  }
  .sidebar-head input[type=text]:focus{ border-color: var(--brass); }
  .sidebar-head input[type=text]::placeholder{ color: var(--text-faint); }
  .select-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11.5px;
    color:var(--text-faint);
  }
  .select-row button{
    background:none;
    border:none;
    color: var(--blue);
    cursor:pointer;
    font-size:11.5px;
    font-family: var(--font-sans);
    font-weight:500;
    padding:0;
  }
  .customer-list{
    overflow-y:auto;
    flex:1;
  }
  .customer{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 18px;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
    transition: background 0.12s;
  }
  .customer:hover{ background: var(--panel2); }
  .customer.active{ background: var(--card); box-shadow: inset 3px 0 0 var(--brass); }
  .customer input[type=checkbox]{ accent-color: var(--brass); cursor:pointer; width:14px; height:14px; }
  .avatar{
    width:36px;height:36px;border-radius:50%;
    background: var(--brass-dim);
    color: var(--brass-text);
    display:flex;align-items:center;justify-content:center;
    font-family: var(--font-display);
    font-size:13px;font-weight:500;
    flex-shrink:0;
  }
  .cinfo{ flex:1; min-width:0; }
  .cname-row{ display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
  .cname{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ctime{ font-size:10px; color:var(--text-faint); font-family: var(--font-mono); flex-shrink:0;}
  .clast{ font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .ctags{ display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .tag{ font-size:9.5px; padding:2px 7px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); letter-spacing:0.2px;}
  .tag.hot{ color:#e3a86a; border-color:#4a3419; background: rgba(227,168,106,0.06); }
  .tag.cold{ color:#8fabf0; border-color:#28345a; background: rgba(143,171,240,0.06); }
  .tag.lang{ color:#c99bff; border-color:#3a2a5a; background: rgba(201,155,255,0.06); }
  .unread-dot{ width:7px;height:7px;border-radius:50%; background:var(--brass); flex-shrink:0; box-shadow: 0 0 6px var(--brass);}

  /* ---------- main ---------- */
  .main{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background: var(--ink);
  }
  .broadcast-bar{
    background: var(--panel);
    border-bottom:1px solid var(--border-soft);
    padding:16px 24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .broadcast-row{ display:flex; gap:10px; align-items:flex-end; }
  .broadcast-row textarea{
    flex:1;
    resize:none;
    background: var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 14px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    font-family: var(--font-sans);
    height:46px;
    outline:none;
    transition: border-color 0.15s;
  }
  .broadcast-row textarea::placeholder{ color: var(--text-faint); }
  .broadcast-row textarea:focus{ border-color: var(--brass); }
  .btn{
    border:none;
    border-radius:var(--radius-sm);
    padding:11px 18px;
    font-size:13px;
    font-weight:600;
    font-family: var(--font-sans);
    cursor:pointer;
    white-space:nowrap;
    transition: filter 0.15s, background 0.15s;
  }
  .btn-primary{ background: var(--brass); color:#171106; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-ghost:hover{ background: var(--panel2); border-color: var(--border); }
  .btn-mini{
    background:transparent;
    border:1px solid var(--border);
    color: var(--blue);
    font-size:10.5px;
    font-family: var(--font-sans);
    padding:3px 9px;
    border-radius:6px;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-mini:hover{ background: var(--panel2); }
  .broadcast-meta{ display:flex; align-items:center; gap:16px; font-size:11.5px; color:var(--text-faint); flex-wrap:wrap; }
  .switch-row{ display:flex; align-items:center; gap:7px; }
  .switch-row input{ accent-color: var(--brass); }

  .chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .chat-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text-faint);
    font-size:13.5px;
    font-family: var(--font-display);
    flex-direction:column;
    gap:8px;
  }
  .chat-header{
    padding:14px 24px;
    border-bottom:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .chat-header .cinfo2{ flex:1; }
  .chat-header .cname{ font-family: var(--font-display); font-size:16px; font-weight:500; }
  .chat-header .csub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; font-family: var(--font-mono); }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:20px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg-wrap{
    max-width:62%;
    display:flex;
    flex-direction:column;
  }
  .msg-wrap.out{ align-self:flex-end; align-items:flex-end; }
  .msg-wrap.in{ align-self:flex-start; align-items:flex-start; }
  .msg{
    padding:10px 14px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.55;
  }
  .msg.out{
    background: var(--brass);
    color:#171106;
    border-bottom-right-radius:4px;
  }
  .msg.in{
    background: var(--card);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg .meta{ font-size:10px; opacity:0.65; margin-top:5px; font-family: var(--font-mono); }
  .msg.typing{ color:var(--text-faint); font-style:italic; }
  .translation{
    margin-top:6px;
    padding:8px 12px;
    background: rgba(108,147,255,0.07);
    border:1px dashed var(--blue);
    border-radius:12px;
    font-size:12.5px;
    color:#aec2ff;
  }
  .chat-input-row{
    padding:14px 24px;
    border-top:1px solid var(--border-soft);
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .chat-input-row textarea{
    flex:1;
    resize:none;
    background: var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 13px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    font-family: var(--font-sans);
    height:42px;
    outline:none;
    transition: border-color 0.15s;
  }
  .chat-input-row textarea::placeholder{ color: var(--text-faint); }
  .chat-input-row textarea:focus{ border-color: var(--brass); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background: var(--card);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:var(--radius-md);
    font-size:12.5px;
    color:var(--text);
    opacity:0;
    transition:opacity 0.25s;
    pointer-events:none;
    z-index:50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">
      <div class="mark">M</div>
      <div class="wordmark" id="tLogo">Meridian</div>
    </div>
    <span class="badge-sim" id="tBadge">Simulation · fictional data</span>
    <div class="lang-toggle">
      <button id="uiLangEn" class="active">EN</button>
      <button id="uiLangZh">中文</button>
    </div>
    <div class="stats">
      <div class="stat-item"><div class="num" id="statTotal">0</div><div class="lbl" id="tStatTotal">Contacts</div></div>
      <div class="stat-item"><div class="num" id="statSelected">0</div><div class="lbl" id="tStatSel">Selected</div></div>
      <div class="stat-item"><div class="num" id="statSent">0</div><div class="lbl" id="tStatSent">Sent today</div></div>
      <div class="stat-item"><div class="num" id="statReplied">0</div><div class="lbl" id="tStatReplied">AI replies</div></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-head">
      <input type="text" id="searchBox" placeholder="Search name / tag">
      <div class="select-row">
        <span id="selCountLabel">0 selected</span>
        <div style="display:flex; gap:12px;">
          <button id="selectAllBtn">Select all</button>
          <button id="clearSelBtn">Clear</button>
        </div>
      </div>
    </div>
    <div class="customer-list" id="customerList"></div>
  </div>

  <div class="main">
    <div class="broadcast-bar">
      <div class="broadcast-row">
        <textarea id="broadcastText" placeholder="Write your outreach message — AI customers reply in their own language"></textarea>
        <button class="btn btn-primary" id="broadcastBtn">Broadcast to selected</button>
      </div>
      <div class="broadcast-meta">
        <label class="switch-row"><input type="checkbox" id="autoReplyToggle" checked> <span id="tAutoReply">Auto AI reply after broadcast</span></label>
        <span id="broadcastHint">Select contacts to enable broadcast</span>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-empty">
        <div id="tEmptyHint">Select a contact to open the thread, or check several to broadcast</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- i18n for UI chrome ---------------- */
const UI = {
  en: {
    logo: "Meridian",
    badge: "Simulation · fictional data",
    statTotal: "Contacts", statSel: "Selected", statSent: "Sent today", statReplied: "AI replies",
    search: "Search name / tag",
    selectAll: "Select all", clearSel: "Clear",
    selCount: n => `${n} selected`,
    broadcastPh: "Write your outreach message — AI customers reply in their own language",
    broadcastBtn: "Broadcast to selected",
    broadcastBtnSending: "Sending...",
    autoReply: "Auto AI reply after broadcast",
    hintNeedSelect: "Select contacts to enable broadcast",
    emptyHint: "Select a contact to open the thread, or check several to broadcast",
    chatPh: name => `Message ${name} directly...`,
    send: "Send",
    aiReply: "Simulate AI reply",
    typing: name => `${name} is typing...`,
    translateBtn: "Translate to Chinese",
    translating: "Translating...",
    toastNoText: "Enter a message to broadcast",
    toastNoSel: "Select at least one contact first",
    toastSent: n => `Broadcast sent to ${n} contacts`,
    langLabel: { en: "English speaker", fr: "French speaker" }
  },
  zh: {
    logo: "Meridian",
    badge: "模拟演示 · 全部数据虚构",
    statTotal: "客户总数", statSel: "已选中", statSent: "今日群发", statReplied: "AI已回复",
    search: "搜索客户姓名 / 标签",
    selectAll: "全选", clearSel: "清空",
    selCount: n => `已选 ${n} 位`,
    broadcastPh: "输入要群发的话术（AI客户会按各自语言理解和回复）",
    broadcastBtn: "群发选中客户",
    broadcastBtnSending: "发送中...",
    autoReply: "群发后模拟客户AI自动回复",
    hintNeedSelect: "选中客户后可群发",
    emptyHint: "点击左侧客户查看会话，或勾选多个客户进行群发",
    chatPh: name => `给 ${name} 单独发消息...`,
    send: "发送",
    aiReply: "让AI模拟客户回复",
    typing: name => `${name} 正在输入...`,
    translateBtn: "翻译成中文",
    translating: "翻译中...",
    toastNoText: "请输入群发内容",
    toastNoSel: "请先在左侧勾选客户",
    toastSent: n => `已群发给 ${n} 位客户`,
    langLabel: { en: "英语客户", fr: "法语客户" }
  }
};
let uiLang = "en";

/* ---------------- fake Canadian customer data ---------------- */
const namesEN = ["James Wilson","Emily Carter","Michael Brown","Olivia Bennett","Ryan Thompson","Sarah Mitchell","David Clarke","Jessica Reid","Andrew Scott","Laura Hughes"];
const namesFR = ["Julien Tremblay","Chloé Gagnon","Marc-André Roy","Camille Bouchard","Étienne Leclerc","Sophie Lavoie","Nicolas Fortin","Amélie Girard","Simon Bélanger","Isabelle Côté"];

const areaCodes = ["416","647","437","514","438","604","613","780","902","204"];
const industries = {
  zh: ["教育培训","美妆护肤","健身私教","家居建材","跨境电商","少儿英语","保险理财","汽车销售","本地餐饮","职业培训"],
  en: ["Education & training","Beauty & skincare","Personal fitness","Home renovation","Cross-border e-commerce","Kids' English tutoring","Insurance & finance","Auto sales","Local dining","Career coaching"]
};
const personaTraits = [
  {tag:{zh:"高意向",en:"Hot lead"}, cls:"hot", style:"interested and upbeat, easily persuaded by discounts, but asks about pricing details"},
  {tag:{zh:"观望中",en:"Considering"}, cls:"cold", style:"cautious, likes to compare options, thinks things are pricey, needs several follow-ups"},
  {tag:{zh:"高意向",en:"Hot lead"}, cls:"hot", style:"direct and decisive, but cares a lot about trustworthiness and guarantees"},
  {tag:{zh:"新客户",en:"New contact"}, cls:"cold", style:"just discovered the product, asks very basic questions"},
  {tag:{zh:"老客户",en:"Returning"}, cls:"hot", style:"has bought something similar before, trusts the seller, casual tone"},
  {tag:{zh:"观望中",en:"Considering"}, cls:"cold", style:"busy, replies briefly or sometimes leaves messages unread"}
];

function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randPhone(){
  const area = randPick(areaCodes);
  const line = String(Math.floor(1000+Math.random()*8999)).padStart(4,'0');
  return `+1 (${area}) 555-${line}`;
}
function randEmail(name, idx){
  const domains = ["mail-demo.ca","test-inbox.net","sample-mail.org"];
  const slug = name.toLowerCase().replace(/[^a-z]+/g,".").replace(/^\.|\.$/g,"");
  return slug + idx + "@" + randPick(domains);
}

let customers = [];
function genCustomers(n){
  const list = [];
  for(let i=0;i<n;i++){
    const lang = Math.random() < 0.5 ? "en" : "fr";
    const name = lang === "en" ? randPick(namesEN) : randPick(namesFR);
    const persona = randPick(personaTraits);
    const industryIdx = Math.floor(Math.random()*industries.zh.length);
    list.push({
      id: "c"+i,
      name,
      phone: randPhone(),
      email: randEmail(name, i),
      lang,
      industryIdx,
      tag: persona.tag,
      tagCls: persona.cls,
      style: persona.style,
      messages: [],
      unread: false,
      selected: false
    });
  }
  return list;
}

customers = genCustomers(14);
let activeId = null;
let sentToday = 0;
let repliedCount = 0;

function initials(name){
  const parts = name.split(" ");
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
function timeNow(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}
function t(){ return UI[uiLang]; }

/* ---------------- UI chrome text refresh ---------------- */
function applyUIStrings(){
  const s = t();
  document.getElementById('tBadge').textContent = s.badge;
  document.getElementById('tStatTotal').textContent = s.statTotal;
  document.getElementById('tStatSel').textContent = s.statSel;
  document.getElementById('tStatSent').textContent = s.statSent;
  document.getElementById('tStatReplied').textContent = s.statReplied;
  document.getElementById('searchBox').placeholder = s.search;
  document.getElementById('selectAllBtn').textContent = s.selectAll;
  document.getElementById('clearSelBtn').textContent = s.clearSel;
  document.getElementById('broadcastText').placeholder = s.broadcastPh;
  document.getElementById('broadcastBtn').textContent = s.broadcastBtn;
  document.getElementById('tAutoReply').textContent = s.autoReply;
  document.getElementById('tEmptyHint').textContent = s.emptyHint;
  document.getElementById('uiLangEn').classList.toggle('active', uiLang==='en');
  document.getElementById('uiLangZh').classList.toggle('active', uiLang==='zh');
  document.documentElement.lang = uiLang === 'zh' ? 'zh-CN' : 'en';
  renderStats();
  renderList();
  renderChat();
}

function renderStats(){
  const s = t();
  document.getElementById('statTotal').textContent = customers.length;
  document.getElementById('statSelected').textContent = customers.filter(c=>c.selected).length;
  document.getElementById('statSent').textContent = sentToday;
  document.getElementById('statReplied').textContent = repliedCount;
  document.getElementById('selCountLabel').textContent = s.selCount(customers.filter(c=>c.selected).length);
  document.getElementById('broadcastHint').textContent = s.hintNeedSelect;
}

function industryName(c){
  return uiLang === 'zh' ? industries.zh[c.industryIdx] : industries.en[c.industryIdx];
}
function tagName(c){ return c.tag[uiLang]; }
function langTagName(c){ return t().langLabel[c.lang]; }

function renderList(){
  const kw = document.getElementById('searchBox').value.trim().toLowerCase();
  const wrap = document.getElementById('customerList');
  wrap.innerHTML = "";
  customers
    .filter(c => !kw || c.name.toLowerCase().includes(kw) || industryName(c).toLowerCase().includes(kw) || tagName(c).toLowerCase().includes(kw))
    .forEach(c => {
      const div = document.createElement('div');
      div.className = "customer" + (c.id===activeId ? " active" : "");
      const last = c.messages[c.messages.length-1];
      const lastPrefix = last ? (last.dir==='out' ? (uiLang==='zh'?'我：':'You: ') : '') : '';
      const lastText = last ? last.text : (industryName(c) + (uiLang==='zh' ? " · 意向客户" : " · prospect"));
      div.innerHTML = `
        <input type="checkbox" data-id="${c.id}" ${c.selected?"checked":""}>
        <div class="avatar">${initials(c.name)}</div>
        <div class="cinfo">
          <div class="cname-row">
            <span class="cname">${c.name}</span>
            <span class="ctime">${last?last.time:""}</span>
          </div>
          <div class="clast">${lastPrefix}${lastText}</div>
          <div class="ctags">
            <span class="tag ${c.tagCls}">${tagName(c)}</span>
            <span class="tag">${industryName(c)}</span>
            <span class="tag lang">${langTagName(c)}</span>
          </div>
        </div>
        ${c.unread ? '<div class="unread-dot"></div>' : ''}
      `;
      div.querySelector('input[type=checkbox]').addEventListener('click', (e)=>{
        e.stopPropagation();
        c.selected = e.target.checked;
        renderStats();
      });
      div.addEventListener('click', ()=>{
        activeId = c.id;
        c.unread = false;
        renderList();
        renderChat();
      });
      wrap.appendChild(div);
    });
  renderStats();
}

function renderChat(){
  const s = t();
  const area = document.getElementById('chatArea');
  const c = customers.find(x=>x.id===activeId);
  if(!c){
    area.innerHTML = `<div class="chat-empty"><div>${s.emptyHint}</div></div>`;
    return;
  }
  area.innerHTML = `
    <div class="chat-header">
      <div class="avatar">${initials(c.name)}</div>
      <div class="cinfo2">
        <div class="cname">${c.name}</div>
        <div class="csub">${c.phone} · ${c.email} · ${industryName(c)} · ${langTagName(c)}</div>
      </div>
      <button class="btn btn-ghost" id="aiReplyBtn">${s.aiReply}</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="${s.chatPh(c.name)}"></textarea>
      <button class="btn btn-primary" id="chatSendBtn">${s.send}</button>
    </div>
  `;
  const msgWrap = document.getElementById('chatMessages');
  c.messages.forEach((m, idx)=>{
    const outer = document.createElement('div');
    outer.className = "msg-wrap " + m.dir;
    const bubble = document.createElement('div');
    bubble.className = "msg " + m.dir;
    bubble.innerHTML = escapeHtml(m.text) + `<div class="meta">${m.time}</div>`;
    outer.appendChild(bubble);

    if(m.dir === 'in'){
      if(m.translation){
        const tr = document.createElement('div');
        tr.className = "translation";
        tr.textContent = "中文：" + m.translation;
        outer.appendChild(tr);
      } else {
        const trBtn = document.createElement('button');
        trBtn.className = "btn-mini";
        trBtn.textContent = s.translateBtn;
        trBtn.addEventListener('click', ()=>translateMessage(c.id, idx, trBtn));
        outer.appendChild(trBtn);
      }
    }
    msgWrap.appendChild(outer);
  });
  msgWrap.scrollTop = msgWrap.scrollHeight;

  document.getElementById('chatSendBtn').addEventListener('click', ()=>sendIndividual(c.id));
  document.getElementById('chatInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendIndividual(c.id); }
  });
  document.getElementById('aiReplyBtn').addEventListener('click', ()=>simulateReply(c.id));
}

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function appendMessage(c, dir, text){
  c.messages.push({dir, text, time: timeNow(), translation: null});
  if(dir==='in' && c.id!==activeId) c.unread = true;
}

function sendIndividual(id){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const c = customers.find(x=>x.id===id);
  appendMessage(c, 'out', text);
  input.value = "";
  renderList();
  renderChat();
}

async function translateMessage(customerId, msgIdx, btnEl){
  const c = customers.find(x=>x.id===customerId);
  const m = c.messages[msgIdx];
  if(!m) return;
  btnEl.disabled = true;
  btnEl.textContent = t().translating;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 200,
        system: "You are a translation engine. Translate the given customer message into natural, concise Simplified Chinese. Return only the translated text, nothing else.",
        messages: [ { role: "user", content: m.text } ]
      })
    });
    const data = await response.json();
    const block = (data.content || []).find(b => b.type === 'text');
    m.translation = block ? block.text.trim() : "（翻译失败）";
  }catch(err){
    m.translation = "（翻译请求失败，可重试）";
  }
  renderChat();
}

async function simulateReply(id){
  const c = customers.find(x=>x.id===id);
  if(!c) return;
  const msgWrap = document.getElementById('chatMessages');
  const typingDiv = document.createElement('div');
  typingDiv.className = "msg in typing";
  typingDiv.textContent = t().typing(c.name);
  if(msgWrap){ msgWrap.appendChild(typingDiv); msgWrap.scrollTop = msgWrap.scrollHeight; }

  const history = c.messages.slice(-8).map(m => (m.dir==='out' ? "Sales: " : "Customer: ") + m.text).join("\n");
  const languageName = c.lang === 'fr' ? "French" : "English";
  const systemPrompt = `You are role-playing a fictional customer for a sales-outreach role-play tool. Everything is fictional and used only for practicing sales messaging, not about a real person.
Customer profile: name ${c.name}, based in Canada, interested in ${industries.en[c.industryIdx]}. Attitude: ${c.style}.
Reply ONLY in ${languageName}, in 1-2 casual, natural sentences, matching the persona above. Do not mention being an AI or a simulation. Do not switch languages.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 200,
        system: systemPrompt,
        messages: [
          { role: "user", content: `Recent conversation:\n${history}\n\nWrite the customer's next reply.` }
        ]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const replyText = textBlock ? textBlock.text.trim() : "(no reply)";
    if(typingDiv && typingDiv.parentNode) typingDiv.remove();
    appendMessage(c, 'in', replyText);
    repliedCount++;
  }catch(err){
    if(typingDiv && typingDiv.parentNode) typingDiv.remove();
    appendMessage(c, 'in', "(simulation request failed, try again)");
  }
  renderList();
  renderChat();
}

async function broadcastMessage(){
  const s = t();
  const text = document.getElementById('broadcastText').value.trim();
  const selected = customers.filter(c=>c.selected);
  if(!text){ showToast(s.toastNoText); return; }
  if(selected.length===0){ showToast(s.toastNoSel); return; }

  const btn = document.getElementById('broadcastBtn');
  btn.disabled = true;
  btn.textContent = s.broadcastBtnSending;

  selected.forEach(c => appendMessage(c, 'out', text));
  sentToday += selected.length;
  document.getElementById('broadcastText').value = "";
  renderList();
  renderChat();
  showToast(s.toastSent(selected.length));

  btn.disabled = false;
  btn.textContent = s.broadcastBtn;

  const autoReply = document.getElementById('autoReplyToggle').checked;
  if(autoReply){
    for(const c of selected){
      await simulateReply(c.id);
      await new Promise(r=>setTimeout(r, 250));
    }
  }
}

document.getElementById('broadcastBtn').addEventListener('click', broadcastMessage);
document.getElementById('searchBox').addEventListener('input', renderList);
document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  customers.forEach(c=>c.selected=true);
  renderList();
});
document.getElementById('clearSelBtn').addEventListener('click', ()=>{
  customers.forEach(c=>c.selected=false);
  renderList();
});
document.getElementById('uiLangEn').addEventListener('click', ()=>{ uiLang='en'; applyUIStrings(); });
document.getElementById('uiLangZh').addEventListener('click', ()=>{ uiLang='zh'; applyUIStrings(); });

applyUIStrings();
</script>

</body>
</html>
