<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Lead Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0b0d12;
    --panel: #12151c;
    --panel2: #171b24;
    --card: #1b202b;
    --border: #262c39;
    --border-soft: #1e2330;
    --text: #eceef3;
    --text-dim: #8991a3;
    --text-faint: #5c6478;
    --brass: #c9a15a;
    --brass-dim: #3a3020;
    --brass-text: #e0bd7f;
    --blue: #6c93ff;
    --blue-dim: #1c2540;
    --green: #6bb894;
    --green-dim: #16281f;
    --red: #d8737a;
    --red-dim: #2c1a1c;
    --gray-dim: #232838;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --font-display: "Fraunces", Georgia, serif;
    --font-sans: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: var(--font-sans);
    background: var(--ink);
    color: var(--text);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    display:grid;
    grid-template-rows: 60px 1fr;
    height:100vh;
  }

  /* ---------- topbar ---------- */
  .topbar{
    background: var(--panel);
    border-bottom:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    padding: 0 22px;
    gap:22px;
  }
  .logo{ display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .logo .mark{
    width:26px;height:26px; border-radius:7px;
    background: linear-gradient(155deg, var(--brass), #8a6a2f);
    display:flex;align-items:center;justify-content:center;
    font-family: var(--font-display); font-weight:600; font-size:14px; color:#171106;
  }
  .logo .wordmark{ font-family: var(--font-display); font-size:17px; font-weight:500; letter-spacing:0.2px; }

  .nav-tabs{ display:flex; gap:2px; height:100%; }
  .nav-tab{
    display:flex; align-items:center;
    padding:0 16px;
    font-size:13px; font-weight:500;
    color: var(--text-dim);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav-tab:hover{ color: var(--text); }
  .nav-tab.active{ color: var(--text); border-bottom-color: var(--brass); }

  .lang-toggle{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-left:auto; }
  .lang-toggle button{
    background: transparent; border:none; color: var(--text-dim);
    font-family: var(--font-sans); font-size:12px; font-weight:500;
    padding:7px 13px; cursor:pointer; transition: background 0.15s, color 0.15s;
  }
  .lang-toggle button + button{ border-left:1px solid var(--border); }
  .lang-toggle button.active{ background: var(--brass-dim); color: var(--brass-text); }

  /* ---------- generic page shell ---------- */
  .page{ height:100%; overflow-y:auto; }
  .page-inner{ max-width:1180px; margin:0 auto; padding:28px 28px 60px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-title{ font-family: var(--font-display); font-size:24px; font-weight:500; }
  .page-sub{ font-size:13px; color:var(--text-faint); margin-top:4px; }

  .btn{
    border:none; border-radius:var(--radius-sm); padding:10px 17px;
    font-size:13px; font-weight:600; font-family: var(--font-sans);
    cursor:pointer; white-space:nowrap; transition: filter 0.15s, background 0.15s;
  }
  .btn-primary{ background: var(--brass); color:#171106; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-ghost:hover{ background: var(--panel2); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; border-radius:6px; }
  .btn-danger-ghost{ background:transparent; border:1px solid #4a2226; color: var(--red); }
  .btn-danger-ghost:hover{ background: var(--red-dim); }
  .btn-green-ghost{ background:transparent; border:1px solid #1e4433; color: var(--green); }
  .btn-green-ghost:hover{ background: var(--green-dim); }

  /* ---------- stat cards ---------- */
  .stat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:26px; }
  .stat-card{ background: var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:16px 18px; }
  .stat-card .num{ font-family: var(--font-display); font-size:26px; font-weight:500; }
  .stat-card .lbl{ font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px; margin-top:4px; }

  /* ---------- table ---------- */
  .data-table{ width:100%; border-collapse:collapse; background: var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md); overflow:hidden; }
  .data-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;
    color: var(--text-faint); font-weight:500; padding:11px 14px; border-bottom:1px solid var(--border-soft);
    background: var(--panel2);
  }
  .data-table td{ padding:12px 14px; font-size:13px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
  .data-table tr:last-child td{ border-bottom:none; }
  .data-table tr:hover td{ background: var(--panel2); }
  .name-cell{ display:flex; align-items:center; gap:10px; }
  .row-avatar{
    width:30px;height:30px;border-radius:50%; background: var(--brass-dim); color: var(--brass-text);
    display:flex;align-items:center;justify-content:center; font-family: var(--font-display); font-size:12px; font-weight:500; flex-shrink:0;
  }
  .mono{ font-family: var(--font-mono); font-size:12px; color:var(--text-dim); }

  .status-badge{ font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:500; letter-spacing:0.2px; white-space:nowrap; }
  .status-new{ color: var(--text-dim); background: var(--gray-dim); }
  .status-in_progress{ color:#8fabf0; background: var(--blue-dim); }
  .status-qualified{ color: var(--green); background: var(--green-dim); }
  .status-disqualified{ color: var(--red); background: var(--red-dim); }

  .score-bar-wrap{ width:70px; height:5px; border-radius:4px; background: var(--gray-dim); overflow:hidden; }
  .score-bar-fill{ height:100%; border-radius:4px; }
  .score-row{ display:flex; align-items:center; gap:8px; }
  .score-num{ font-family: var(--font-mono); font-size:11.5px; color: var(--text-dim); width:22px; text-align:right; }

  select, input[type=checkbox]{ accent-color: var(--brass); }
  select{
    background: var(--card); border:1px solid var(--border); color:var(--text);
    padding:7px 10px; border-radius:var(--radius-sm); font-size:12.5px; font-family: var(--font-sans); outline:none;
  }
  select:focus{ border-color: var(--brass); }

  .toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar .sep{ width:1px; height:20px; background: var(--border); }
  .toolbar-label{ font-size:12px; color: var(--text-faint); }

  .empty-state{
    text-align:center; padding:60px 20px; color: var(--text-faint);
  }
  .empty-state .title{ font-family: var(--font-display); font-size:17px; color: var(--text); margin-bottom:6px; }
  .empty-state .body{ font-size:13px; max-width:380px; margin:0 auto 18px; line-height:1.6; }

  textarea.msg-input{
    width:100%; resize:none; background: var(--card); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:var(--radius-md); font-size:13.5px; font-family: var(--font-sans); height:70px; outline:none;
  }
  textarea.msg-input:focus{ border-color: var(--brass); }
  textarea.msg-input::placeholder{ color: var(--text-faint); }

  .card{ background: var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:18px 20px; }
  .card + .card{ margin-top:14px; }

  /* ---------- pipeline (list + chat) ---------- */
  .pipeline-shell{ display:grid; grid-template-columns: 300px 1fr; height:100%; }
  .pl-sidebar{ background: var(--panel); border-right:1px solid var(--border-soft); display:flex; flex-direction:column; overflow:hidden; }
  .pl-search{ padding:14px 16px; border-bottom:1px solid var(--border-soft); }
  .pl-search input{
    width:100%; background: var(--card); border:1px solid var(--border); color:var(--text);
    padding:8px 11px; border-radius:var(--radius-sm); font-size:13px; font-family: var(--font-sans); outline:none;
  }
  .pl-search input:focus{ border-color: var(--brass); }
  .pl-list{ overflow-y:auto; flex:1; }
  .pl-item{ display:flex; align-items:center; gap:11px; padding:12px 16px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background 0.12s; }
  .pl-item:hover{ background: var(--panel2); }
  .pl-item.active{ background: var(--card); box-shadow: inset 3px 0 0 var(--brass); }
  .pl-info{ flex:1; min-width:0; }
  .pl-name-row{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .pl-name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-time{ font-size:10px; color:var(--text-faint); font-family: var(--font-mono); flex-shrink:0; }
  .pl-last{ font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .pl-unread{ width:7px;height:7px;border-radius:50%; background:var(--brass); flex-shrink:0; box-shadow:0 0 6px var(--brass); }

  .chat-col{ display:flex; flex-direction:column; overflow:hidden; }
  .chat-empty{ flex:1; display:flex; align-items:center; justify-content:center; color: var(--text-faint); font-size:13.5px; font-family: var(--font-display); }
  .chat-header{ padding:14px 22px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:12px; }
  .chat-header .cname{ font-family: var(--font-display); font-size:16px; font-weight:500; }
  .chat-header .csub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; font-family: var(--font-mono); }
  .chat-messages{ flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
  .msg-wrap{ max-width:62%; display:flex; flex-direction:column; }
  .msg-wrap.out{ align-self:flex-end; align-items:flex-end; }
  .msg-wrap.in{ align-self:flex-start; align-items:flex-start; }
  .msg{ padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.55; }
  .msg.out{ background: var(--brass); color:#171106; border-bottom-right-radius:4px; }
  .msg.in{ background: var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg .meta{ font-size:10px; opacity:0.65; margin-top:5px; font-family: var(--font-mono); }
  .msg.typing{ color:var(--text-faint); font-style:italic; }
  .translation{ margin-top:6px; padding:8px 12px; background: rgba(108,147,255,0.07); border:1px dashed var(--blue); border-radius:12px; font-size:12.5px; color:#aec2ff; }
  .btn-mini{ background:transparent; border:1px solid var(--border); color: var(--blue); font-size:10.5px; font-family: var(--font-sans); padding:3px 9px; border-radius:6px; cursor:pointer; margin-top:6px; }
  .btn-mini:hover{ background: var(--panel2); }
  .chat-input-row{ padding:14px 22px; border-top:1px solid var(--border-soft); display:flex; gap:10px; align-items:flex-end; }
  .chat-input-row textarea{ flex:1; resize:none; background: var(--card); border:1px solid var(--border); color:var(--text); padding:10px 13px; border-radius:var(--radius-md); font-size:13.5px; font-family: var(--font-sans); height:42px; outline:none; }
  .chat-input-row textarea:focus{ border-color: var(--brass); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background: var(--card); border:1px solid var(--border); padding:10px 18px; border-radius:var(--radius-md);
    font-size:12.5px; color:var(--text); opacity:0; transition:opacity 0.25s; pointer-events:none; z-index:50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .toast.show{ opacity:1; }

  .checkbox-cell{ width:34px; }
  .topic-pill{ font-size:10.5px; padding:2px 8px; border-radius:20px; border:1px solid #3a2a5a; color:#c99bff; background: rgba(201,155,255,0.06); white-space:nowrap; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo"><div class="mark">M</div><div class="wordmark">Meridian</div></div>
    <div class="nav-tabs" id="navTabs"></div>
    <div class="lang-toggle">
      <button id="uiLangEn" class="active">EN</button>
      <button id="uiLangZh">中文</button>
    </div>
  </div>
  <div id="pageRoot" class="page"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Config — point this at your own Cloudflare Worker proxy.
   Calling api.anthropic.com directly from a deployed static
   page will always fail (no key, CORS). See worker.js.
   ========================================================= */
const API_ENDPOINT = "https://meridian-proxy.niubiericc.workers.dev"; // <-- replace with your deployed worker URL

/* =========================================================
   i18n
   ========================================================= */
const UI = {
  en: {
    navOverview:"Overview", navImport:"Import leads", navAdmin:"Admin", navOutreach:"Outreach", navPipeline:"Pipeline", navQualified:"Qualified",
    ovTitle:"Pipeline overview", ovSub:"Snapshot of the full acquisition funnel",

    markQualified:"Mark qualified", markDisqualified:"Mark disqualified",

    selectContact:"Select a lead to open the thread",
    chatPh: name => `Message ${name}...`,

    translateBtn:"Translate to Chinese",

    searchPh:"Search leads",
    selectAll:"Select all", clearSel:"Clear",
    selCount: n => `${n} selected`
  },
  zh: {
    navOverview:"总览", navImport:"导入客户", navAdmin:"后台设置", navOutreach:"群发触达", navPipeline:"对话流水", navQualified:"客户筛选",
    ovTitle:"获客流程总览", ovSub:"完整获客漏斗数据一览",
    stTotal:"客户总数", stContacted:"已触达", stQualified:"已合格", stDisqualified:"已淘汰",
    importTitle:"导入客户", importSub:"在发起触达之前，先批量导入一批新客户到数据库",
    importBtn: n => `导入 ${n} 位新客户`,
    importedToast: n => `已导入 ${n} 位新客户`,
    recentImports:"最近导入",
    adminTitle:"对话方向设置", adminSub:"批量为客户设置AI对话的话题导向",
    applyTo: n => `应用到已选中的 ${n} 位`,
    topicCol:"话题导向", nameCol:"姓名", statusCol:"状态", scoreCol:"意向分", industryCol:"行业", langCol:"语言", actionsCol:"操作",
    outreachTitle:"群发触达", outreachSub:"选择客户，发送第一句触达话术",
    composerPh:"输入触达话术...",
    sendBtn: n => `发送给 ${n} 位已选中客户`,
    sendingBtn:"发送中...",
    noTextToast:"请先输入消息内容",
    noSelToast:"请至少选中一位客户",
    sentToast: n => `已发送给 ${n} 位客户`,
    onlyNewHint:"仅显示尚未触达的客户",
    pipelineTitle:"对话流水", pipelineSub:"当前所有进行中的对话",
    qualifiedTitle:"客户筛选", qualifiedSub:"最终人工确认——根据对话质量筛选合格客户",
    filterAll:"全部", filterInProgress:"沟通中", filterQualified:"已合格", filterDisqualified:"已淘汰",
    markQualified:"标记为合格", markDisqualified:"标记为淘汰",
    emptyImportTitle:"暂无客户", emptyImportBody:"先导入第一批客户，开始建立获客流水线。",
    emptyOutreachTitle:"暂无可发送对象", emptyOutreachBody:"所有客户都已经触达过，或者你还没有导入客户。",
    emptyPipelineTitle:"暂无对话", emptyPipelineBody:"先完成一轮群发触达——客户被联系后，对话会显示在这里。",
    emptyQualifiedTitle:"暂无筛选结果", emptyQualifiedBody:"客户开始回复后，会出现在这里供你做最终筛选。",
    selectContact:"选择左侧客户查看对话",
    chatPh: name => `给 ${name} 发消息...`,
    send:"发送",
    typing: name => `${name} 正在输入...`,
    translateBtn:"翻译成中文",
    translating:"翻译中...",
    searchPh:"搜索客户",
    selectAll:"全选", clearSel:"清空",
    selCount: n => `已选 ${n} 位`
  }
};
let uiLang = "en";
function t(){ return UI[uiLang]; }

/* =========================================================
   Topic directions (admin-controlled conversation angle)
   ========================================================= */
const TOPIC_DIRECTIONS = [
  {id:"price",     en:"Price & incentives",   zh:"价格优惠导向",   prompt:"Steer the conversation toward pricing, discounts, bundles, and limited-time offers. Ask about cost and try to negotiate."},
  {id:"trust",     en:"Trust & credibility",  zh:"信任背书导向",   prompt:"Focus on trust: ask about credentials, guarantees, other customers, and reviews before committing to anything."},
  {id:"urgency",   en:"Urgency & scarcity",   zh:"紧迫感导向",     prompt:"Respond with a sense of urgency or worry about missing out, ask about deadlines and limited availability."},
  {id:"education", en:"Product education",   zh:"产品功能导向",   prompt:"Ask detailed, curious questions about how the product or service actually works and what it includes."},
  {id:"rapport",   en:"Casual rapport",       zh:"关系破冰导向",   prompt:"Keep the tone casual and friendly, small talk before getting into business specifics."},
  {id:"objection", en:"Objection practice",   zh:"异议处理导向",   prompt:"Raise realistic objections and hesitations (too expensive, bad timing, already using something else) for the salesperson to handle."}
];
function topicById(id){ return TOPIC_DIRECTIONS.find(x=>x.id===id) || TOPIC_DIRECTIONS[4]; }
function topicLabel(id){ const tp = topicById(id); return uiLang==='zh' ? tp.zh : tp.en; }

/* =========================================================
   Fake Canadian lead generator
   ========================================================= */
const namesEN = ["James Wilson","Emily Carter","Michael Brown","Olivia Bennett","Ryan Thompson","Sarah Mitchell","David Clarke","Jessica Reid","Andrew Scott","Laura Hughes","Kevin Walsh","Natalie Price","Brian Foster","Megan Ward"];
const namesFR = ["Julien Tremblay","Chloé Gagnon","Marc-André Roy","Camille Bouchard","Étienne Leclerc","Sophie Lavoie","Nicolas Fortin","Amélie Girard","Simon Bélanger","Isabelle Côté","Mathieu Pelletier","Laurence Morin"];
const areaCodes = ["416","647","437","514","438","604","613","780","902","204"];
const industries = {
  zh: ["教育培训","美妆护肤","健身私教","家居建材","跨境电商","少儿英语","保险理财","汽车销售","本地餐饮","职业培训"],
  en: ["Education & training","Beauty & skincare","Personal fitness","Home renovation","Cross-border e-commerce","Kids' English tutoring","Insurance & finance","Auto sales","Local dining","Career coaching"]
};
const attitudes = [
  "interested and upbeat, easily persuaded by discounts, but asks about pricing details",
  "cautious, likes to compare options, thinks things are pricey, needs several follow-ups",
  "direct and decisive, but cares a lot about trustworthiness and guarantees",
  "just discovered the product, asks very basic questions",
  "has bought something similar before, trusts the seller, casual tone",
  "busy, replies briefly or sometimes leaves messages unread"
];

function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randPhone(){
  const area = randPick(areaCodes);
  const line = String(Math.floor(1000+Math.random()*8999)).padStart(4,'0');
  return `+1 (${area}) 555-${line}`;
}
function randEmail(name, uid){
  const domains = ["mail-demo.ca","test-inbox.net","sample-mail.org"];
  const slug = name.toLowerCase().replace(/[^a-z]+/g,".").replace(/^\.|\.$/g,"");
  return slug + uid + "@" + randPick(domains);
}
function uid(){ return 'l' + Date.now().toString(36) + Math.floor(Math.random()*10000).toString(36); }

function genLead(){
  const lang = Math.random() < 0.5 ? "en" : "fr";
  const name = lang === "en" ? randPick(namesEN) : randPick(namesFR);
  const industryIdx = Math.floor(Math.random()*industries.zh.length);
  return {
    id: uid(),
    name,
    phone: randPhone(),
    email: randEmail(name, Math.floor(Math.random()*99999)),
    lang,
    industryIdx,
    attitude: randPick(attitudes),
    topic: randPick(TOPIC_DIRECTIONS).id,
    status: "new",        // new | in_progress | qualified | disqualified
    manualOverride: false,
    score: 0,
    messages: [],
    unread: false,
    createdAt: Date.now()
  };
}
function genLeadBatch(n){
  const batch = [];
  for(let i=0;i<n;i++) batch.push(genLead());
  return batch;
}

/* =========================================================
   Local "database" (localStorage)
   ========================================================= */
const DB_KEY = "meridian_leads_db_v1";
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(leads)); }catch(e){}
}

let leads = loadDB();
if(!leads || !Array.isArray(leads) || leads.length===0){
  leads = genLeadBatch(12);
  saveDB();
}

let currentPage = "overview";
let activeLeadId = null;
let selectedIds = new Set();

function initials(name){
  const parts = name.split(" ");
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
function timeNow(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}
function industryName(lead){ return uiLang === 'zh' ? industries.zh[lead.industryIdx] : industries.en[lead.industryIdx]; }
function escapeHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function scoreColor(score){
  if(score>=70) return "var(--green)";
  if(score>=40) return "var(--brass)";
  return "var(--text-faint)";
}
function statusLabel(status){
  const s = t();
  return { new: s.filterAll==="全部"?"新客户":"New", in_progress: s.filterInProgress, qualified: s.filterQualified, disqualified: s.filterDisqualified }[status] || status;
}

function renderPipeline(){

  if(contacted.length===0){
    return `<div class="page-inner"><div class="page-head"><div><div class="page-title">${s.pipelineTitle}</div><div class="page-sub">${s.pipelineSub}</div></div></div>

  }
  return `

      <div class="pl-sidebar">
        <div class="pl-search"><input type="text" id="pipelineSearch" placeholder="${s.searchPh}"></div>
        <div class="pl-list" id="pipelineList"></div>
      </div>
      <div class="chat-col" id="pipelineChat"></div>
    </div>
  `;
}

function renderPipelineList(){
  const s = t();
  const kw = (document.getElementById('pipelineSearch')?.value || "").trim().toLowerCase();
  const wrap = document.getElementById('pipelineList');
  if(!wrap) return;
  const contacted = leads.filter(l=>l.status!=="new")
    .filter(l => !kw || l.name.toLowerCase().includes(kw) || industryName(l).toLowerCase().includes(kw))
    .sort((a,b)=>{
      const at = a.messages[a.messages.length-1]?.ts || 0;
      const bt = b.messages[b.messages.length-1]?.ts || 0;
      return bt - at;
    });
  wrap.innerHTML = "";
  contacted.forEach(l=>{
    const last = l.messages[l.messages.length-1];
    const div = document.createElement('div');
    div.className = "pl-item" + (l.id===activeLeadId ? " active" : "");
    const lastPrefix = last ? (last.dir==='out' ? (uiLang==='zh'?'我：':'You: ') : '') : '';
    div.innerHTML = `
      <div class="row-avatar">${initials(l.name)}</div>
      <div class="pl-info">
        <div class="pl-name-row"><span class="pl-name">${l.name}</span><span class="pl-time">${last?last.time:""}</span></div>
        <div class="pl-last">${lastPrefix}${last?escapeHtml(last.text):""}</div>
      </div>
      ${l.unread ? '<div class="pl-unread"></div>' : ''}
    `;
    div.addEventListener('click', ()=>{
      activeLeadId = l.id;
      l.unread = false;
      saveDB();
      renderPipelineList();
      renderPipelineChat();
    });
    wrap.appendChild(div);
  });
}

function renderPipelineChat(){
  const s = t();
  const area = document.getElementById('pipelineChat');
  if(!area) return;
  const l = leads.find(x=>x.id===activeLeadId);
  if(!l){
    area.innerHTML = `<div class="chat-empty">${s.selectContact}</div>`;
    return;
  }
  area.innerHTML = `
    <div class="chat-header">
      <div class="row-avatar">${initials(l.name)}</div>
      <div style="flex:1;">
        <div class="cname">${l.name}</div>
        <div class="csub">${l.phone} · ${l.email} · ${industryName(l)}</div>
      </div>
      <span class="status-badge status-${l.status}">${statusLabel(l.status)}</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="${s.chatPh(l.name)}"></textarea>
      <button class="btn btn-primary" id="chatSendBtn">${s.send}</button>
    </div>
  `;
  const msgWrap = document.getElementById('chatMessages');
  l.messages.forEach((m, idx)=>{
    const outer = document.createElement('div');
    outer.className = "msg-wrap " + m.dir;
    const bubble = document.createElement('div');
    bubble.className = "msg " + m.dir;
    bubble.innerHTML = escapeHtml(m.text) + `<div class="meta">${m.time}</div>`;
    outer.appendChild(bubble);
    if(m.dir === 'in'){
      if(m.translation){
        const tr = document.createElement('div');
        tr.className = "translation";
        tr.textContent = "中文：" + m.translation;
        outer.appendChild(tr);
      } else {
        const trBtn = document.createElement('button');
        trBtn.className = "btn-mini";
        trBtn.textContent = s.translateBtn;
        trBtn.addEventListener('click', ()=>translateMessage(l.id, idx, trBtn));
        outer.appendChild(trBtn);
      }
    }
    msgWrap.appendChild(outer);
  });
  msgWrap.scrollTop = msgWrap.scrollHeight;

  document.getElementById('chatSendBtn').addEventListener('click', ()=>sendIndividual(l.id));
  document.getElementById('chatInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendIndividual(l.id); }
  });
}

/* =========================================================
   Message + AI simulation logic
   ========================================================= */
function appendMessage(lead, dir, text){
  lead.messages.push({dir, text, time: timeNow(), ts: Date.now(), translation: null});
  if(dir==='in' && lead.id!==activeLeadId) lead.unread = true;
  saveDB();
}

function sendIndividual(id){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const l = leads.find(x=>x.id===id);
  appendMessage(l, 'out', text);
  input.value = "";
  renderPipelineList();
  renderPipelineChat();
}

async function translateMessage(leadId, msgIdx, btnEl){
  const l = leads.find(x=>x.id===leadId);
  const m = l.messages[msgIdx];
  if(!m) return;
  btnEl.disabled = true;
  btnEl.textContent = t().translating;
  try{
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 200,
        system: "You are a translation engine. Translate the given customer message into natural, concise Simplified Chinese. Return only the translated text, nothing else.",
        messages: [ { role: "user", content: m.text } ]
      })
    });
    const data = await response.json();
    const block = (data.content || []).find(b => b.type === 'text');
    m.translation = block ? block.text.trim() : "（翻译失败）";
  }catch(err){
    m.translation = "（翻译请求失败，可重试）";
  }
  saveDB();
  renderPipelineChat();
}

/* =========================================================
   Page render dispatch
   ========================================================= */
function renderPage(){
  const root = document.getElementById('pageRoot');
  let html = "";
  if(currentPage==="overview") html = renderOverview();
  else if(currentPage==="import") html = renderImport();
  else if(currentPage==="admin") html = renderAdmin();
  else if(currentPage==="outreach") html = renderOutreach();
  else if(currentPage==="pipeline") html = renderPipeline();
  else if(currentPage==="qualified") html = renderQualified();
  root.innerHTML = html;
  wirePageEvents();
}

function wirePageEvents(){
  if(currentPage==="import"){
    document.getElementById('importBtn')?.addEventListener('click', ()=>{
      const batch = genLeadBatch(10);
      leads = leads.concat(batch);
      saveDB();
      showToast(t().importedToast(10));
      renderPage();
    });
  }

  if(currentPage==="admin"){
    document.querySelectorAll('.admin-row-cb').forEach(cb=>{
      cb.addEventListener('change', (e)=>{
        const id = e.target.getAttribute('data-id');
        if(e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
        renderPage();
      });
    });
    document.getElementById('adminSelectAll')?.addEventListener('click', ()=>{
      leads.forEach(l=>selectedIds.add(l.id));
      renderPage();
    });
    document.getElementById('adminClearSel')?.addEventListener('click', ()=>{
      selectedIds.clear();
      renderPage();
    });
    document.getElementById('applyTopicBtn')?.addEventListener('click', ()=>{
      const topicId = document.getElementById('bulkTopicSelect').value;
      leads.forEach(l=>{ if(selectedIds.has(l.id)) l.topic = topicId; });
      saveDB();
      selectedIds.clear();
      renderPage();
    });
  }

  if(currentPage==="outreach"){
    document.querySelectorAll('.outreach-row-cb').forEach(cb=>{
      cb.addEventListener('change', (e)=>{
        const id = e.target.getAttribute('data-id');
        if(e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
        renderPage();
      });
    });
    document.getElementById('outreachSelectAll')?.addEventListener('click', ()=>{
      leads.filter(l=>l.status==="new").forEach(l=>selectedIds.add(l.id));
      renderPage();
    });
    document.getElementById('outreachClearSel')?.addEventListener('click', ()=>{
      selectedIds.clear();
      renderPage();
    });
    document.getElementById('outreachSendBtn')?.addEventListener('click', sendOutreach);
  }

  if(currentPage==="pipeline"){
    renderPipelineList();
    renderPipelineChat();
    document.getElementById('pipelineSearch')?.addEventListener('input', renderPipelineList);
  }

  if(currentPage==="qualified"){
    document.getElementById('qualifiedFilterSel')?.addEventListener('change', (e)=>{
      qualifiedFilter = e.target.value;
      renderPage();
    });
    document.querySelectorAll('[data-qualify]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const id = e.target.getAttribute('data-qualify');
        const l = leads.find(x=>x.id===id);
        l.status = "qualified"; l.manualOverride = true;
        saveDB();
        renderPage();
      });
    });
    document.querySelectorAll('[data-disqualify]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const id = e.target.getAttribute('data-disqualify');
        const l = leads.find(x=>x.id===id);
        l.status = "disqualified"; l.manualOverride = true;
        saveDB();
        renderPage();
      });
    });
  }
}

function sendOutreach(){
  const s = t();
  const text = document.getElementById('outreachText').value.trim();
  const targets = leads.filter(l=>l.status==="new" && selectedIds.has(l.id));
  if(!text){ showToast(s.noTextToast); return; }
  if(targets.length===0){ showToast(s.noSelToast); return; }

  targets.forEach(l=>{
    l.status = "in_progress";
    appendMessage(l, 'out', text);
  });
  saveDB();
  selectedIds.clear();
  showToast(s.sentToast(targets.length));
  renderPage();
}

/* =========================================================
   Boot
   ========================================================= */
function renderAll(){
  renderNav();
  renderPage();
  document.getElementById('uiLangEn').classList.toggle('active', uiLang==='en');
  document.getElementById('uiLangZh').classList.toggle('active', uiLang==='zh');
  document.documentElement.lang = uiLang === 'zh' ? 'zh-CN' : 'en';
}

document.getElementById('uiLangEn').addEventListener('click', ()=>{ uiLang='en'; renderAll(); });
document.getElementById('uiLangZh').addEventListener('click', ()=>{ uiLang='zh'; renderAll(); });

renderAll();
</script>
